plugins {
    id 'com.github.johnrengelman.shadow'
}

apply from: '../modprops.gradle'
archivesBaseName = project.archives_base_name
version = project.mod_version + "-Fabric-${rootProject.minecraft_version}"
group = project.maven_group

architectury {
    platformSetupLoomIde()
    fabric()
}

loom {
    accessWidenerPath = project(":${project.modid}-common").loom.accessWidenerPath
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentFabric.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modApi "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-fabric:${rootProject.architectury_version}"

    common(project(path: ":${project.modid}-common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":${project.modid}-common", configuration: "transformProductionFabric"))
    
    // Forge config API port
    modApi "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:21.1.3"
    
    //// Mod compatibilities
    // REI (for finding and giving mod-added stuff)
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-fabric:16.0.788"
    // Comforts for Fabric
    modRuntimeOnly "curse.maven:comforts-276951:5821144"
    // Libs for Comforts-Fabric
    modImplementation "com.illusivesoulworks.spectrelib:spectrelib-fabric:0.17.2+1.21"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-base:6.1.0"
    modImplementation "org.ladysnake.cardinal-components-api:cardinal-components-entity:6.1.0"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version
    }
}

shadowJar {
    //exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    injectAccessWidener = true
    inputFile.set shadowJar.archiveFile
    //dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":${project.modid}-common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

