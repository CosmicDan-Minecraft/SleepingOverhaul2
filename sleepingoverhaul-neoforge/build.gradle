plugins {
    id 'com.github.johnrengelman.shadow'
}

apply from: '../modprops.gradle'
archivesBaseName = project.archives_base_name
version = project.mod_version + "-NeoForge-${rootProject.minecraft_version}"
group = project.maven_group

/*
loom {
    accessWidenerPath = project(":${project.modid}-common").loom.accessWidenerPath

    forge {
        convertAccessWideners = true
        extraAccessWideners.add loom.accessWidenerPath.get().asFile.name

        mixinConfig "sleepingoverhaul-common.mixins.json"
        mixinConfig "sleepingoverhaul-forge.mixins.json"
    }
}
*/

architectury {
    platformSetupLoomIde()
    neoForge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common

    // Files in this configuration will be bundled into your mod using the Shadow plugin.
    // Don't use the `shadow` configuration from the plugin itself as it's meant for excluding files.
    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

repositories {
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
}

dependencies {
    neoForge "net.neoforged:neoforge:$rootProject.neoforge_version"
    // Remove the next line if you don't want to depend on the API
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":${project.modid}-common", configuration: "namedElements")) { transitive false }
    shadowBundle(project(path: ":${project.modid}-common", configuration: "transformProductionNeoForge"))

    // Forge config API port
    // Not needed since we're targetting NeoForge
    
    //// Mod compatibilities
    // REI (for finding and giving mod-added stuff)
    modRuntimeOnly "me.shedaniel:RoughlyEnoughItems-neoforge:16.0.788"
    // Comforts for NeoForge (and SpectreLib)
    modRuntimeOnly "curse.maven:comforts-276951:5821146"
    modImplementation "com.illusivesoulworks.spectrelib:spectrelib-neoforge:0.17.2+1.21"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    //exclude "fabric.mod.json"
    //exclude "architectury.common.json"

    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
    //dependsOn shadowJar
    archiveClassifier = null
}

jar {
    archiveClassifier = "dev"
}

sourcesJar {
    def commonSources = project(":${project.modid}-common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

